<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LADIS | Poetry Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Serif+SC:wght@200;300&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #F4F2EE; color: #222222; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 8vh 2rem; font-family: 'Cormorant Garamond', 'Noto Serif SC', serif; }
        .paper-texture { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.025; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E"); }
        .archive-header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8vh; z-index: 10; }
        .archive-header .back-btn { font-size: 0.9rem; text-decoration: none; color: #8A8F96; letter-spacing: 0.1em; }
        .archive-header h2 { font-size: 1.5rem; font-weight: 300; letter-spacing: 0.2em; text-transform: uppercase; }
        .archive-list { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 1.8rem; z-index: 10; }
        .archive-item { display: flex; justify-content: space-between; align-items: flex-end; text-decoration: none; color: #222222; padding-bottom: 0.6rem; border-bottom: 1px solid rgba(138, 143, 150, 0.1); }
        .item-title { display: flex; flex-direction: column; gap: 0.2rem; }
        .item-index { font-size: 0.8rem; color: #8A8F96; }
        .item-name { font-size: 1.05rem; font-weight: 300; }
        .item-meta { font-size: 0.85rem; color: #8A8F96; }
    </style>
</head>
<body>
    <div class="paper-texture"></div>
    <header class="archive-header">
        <a href="https://ladis.site" class="back-btn">← Return</a >
        <h2>Poetry</h2>
    </header>
    <main class="archive-list">
        <a href="poetry-01.html" class="archive-item">
            <div class="item-title">
                <span class="item-index">Verse. 01</span>
                <span class="item-name">未命名的无题诗集</span>
            </div>
            <div class="item-meta"><span>2026</span></div>
        </a >
    </main>
</body>
</html>

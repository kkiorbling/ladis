<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Serif+SC:wght@200;300&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0 !important;
            padding: 0 !important;
            box-sizing: border-box !important;
        }

        body {
            background: #F4F2EE !important; /* 全站统一的高级冷白基底 */
            color: #222222 !important;
            width: 100vw !important;
            height: 100vh !important;
            overflow: hidden !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: space-between !important;
            align-items: center !important;
            padding: 12vh 2rem !important;
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif !important;
            
            /* 模拟自然光照在画布上的微弱环境光（左上微暖，右下微冷） */
            background-image: radial-gradient(circle at 30% 20%, rgba(255, 253, 249, 0.6) 0%, rgba(244, 242, 238, 0.2) 60%, rgba(230, 228, 224, 0.3) 100%) !important;
            
            /* 极其克制的白墙暗角。四角微微收紧，产生画廊聚焦感 */
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.02) !important;
            
            position: relative;
        }

        .paper-texture {
            position: fixed !important;
            inset: 0 !important;
            z-index: 1 !important;
            pointer-events: none !important;
            opacity: 0.045 !important;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E") !important;
            mix-blend-mode: multiply !important; 
        }
                
        #canvas-container {
            position: fixed !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 0 !important;
            pointer-events: none !important;
        }

        .fog-layer {
            position: fixed !important;
            inset: -50% !important;
            z-index: 2 !important;
            pointer-events: none !important;
            background: radial-gradient(circle at 30% 40%, rgba(232, 230, 226, 0.5) 0%, transparent 60%), radial-gradient(circle at 80% 70%, rgba(138, 143, 150, 0.15) 0%, transparent 50%) !important;
            animation: subtleFog 60s ease-in-out infinite alternate !important;
        }

        @keyframes subtleFog {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(2%, -3%) scale(1.03); }
            100% { transform: translate(-1%, 2%) scale(0.98); }
        }

        .header-zone {
            z-index: 10 !important;
            text-align: center !important;
            width: 100% !important;
        }

        .header-zone h1 {
            font-size: 2.2rem !important;
            font-weight: 300 !important;
            letter-spacing: 0.6em !important;
            padding-left: 0.6em !important;
            text-transform: uppercase !important;
        }

        /* 页面中央中轴沉淀点 */
        .hero-center {
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            z-index: 10 !important;
            pointer-events: none !important;
        }

        .center-anchor {
            font-size: 0.75rem !important;
            font-weight: 300 !important;
            letter-spacing: 0.6em !important;
            color: #8A8F96 !important;
            opacity: 0.35 !important;
            text-transform: uppercase !important;
        }

        /* 底部导航展牌区域 */
        .nav-zone {
            z-index: 10 !important;
            width: 100% !important;
            max-width: 600px !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            border-top: 1px solid rgba(138, 143, 150, 0.15) !important;
            padding-top: 1.8rem !important;
        }

        .nav-links {
            width: 100% !important;
            display: flex !important;
            flex-direction: row !important;
            justify-content: space-between !important;
            align-items: center !important;
        }

        .nav-item {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            text-decoration: none !important;
            transition: all 0.4s ease !important;
        }

        .nav-label-en {
            font-size: 1rem !important;
            font-weight: 300 !important;
            color: #222222 !important;
            letter-spacing: 0.05em !important;
            transition: color 0.3s ease !important;
        }

        .nav-label-zh {
            font-size: 0.7rem !important;
            font-weight: 200 !important;
            color: #8A8F96 !important;
            letter-spacing: 0.15em !important;
            margin-top: 0.3rem !important;
            opacity: 0.65 !important;
            transition: opacity 0.3s ease, color 0.3s ease !important;
        }

        .nav-item:hover .nav-label-en { color: #000000 !important; }
        .nav-item:hover .nav-label-zh { opacity: 1 !important; color: #222222 !important; }

        @media (max-width: 640px) {
            .header-zone h1 { font-size: 1.8rem !important; letter-spacing: 0.4em !important; padding-left: 0.4em !important; }
            .nav-label-en { font-size: 0.85rem !important; }
            .nav-label-zh { font-size: 0.65rem !important; }
            body { padding: 12vh 1.5rem !important; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- WebGL 蚕丝背景容器 -->
    <div id="canvas-container"></div>

    <!-- 自然纸张肌理与薄雾飘动层 -->
    <div class="paper-texture"></div>
    <div class="fog-layer"></div>

    <!-- 顶栏标志 -->
    <div class="header-zone">
        <h1>LADIS</h1>
    </div>

    <!-- 画面中央中轴点 -->
    <div class="hero-center">
        <span class="center-anchor">A R C H I V E</span>
    </div>

    <!-- 底部双语展牌导航栏 -->
    <div class="nav-zone">
        <nav class="nav-links">
            <a href="novel.html" class="nav-item">
                <span class="nav-label-en">Novel</span>
                <span class="nav-label-zh">小说</span>
            </a>
            <a href="poetry.html" class="nav-item">
                <span class="nav-label-en">Poetry</span>
                <span class="nav-label-zh">诗歌</span>
            </a>
            <a href="illustration.html" class="nav-item">
                <span class="nav-label-en">Illustration</span>
                <span class="nav-label-zh">插画</span>
            </a>
            <a href="notes.html" class="nav-item">
                <span class="nav-label-en">Notes</span>
                <span class="nav-label-zh">杂思</span>
            </a>
            <a href="about.html" class="nav-item">
                <span class="nav-label-en">About</span>
                <span class="nav-label-zh">关于</span>
            </a>
        </nav>
    </div>

    <!-- Three.js 蚕丝流光逻辑 -->
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const uniforms = {
            u_time: { value: 0 },
            u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
            u_mouse: { value: new THREE.Vector2(-1000, -1000) },
            u_mouse_active: { value: 0.0 }
        };

        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform float u_time;
            uniform vec2 u_resolution;
            uniform vec2 u_mouse;
            uniform float u_mouse_active;
            varying vec2 vUv;

            float hash(vec3 p) {
                p = fract(p * 0.1031);
                p += dot(p, p.yzx + 33.33);
                return fract((p.x + p.y) * p.z);
            }

            float noise3D(vec3 p) {
                vec3 i = floor(p);
                vec3 f = fract(p);
                f = f * f * (3.0 - 2.0 * f);

                return mix(
                    mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
                        mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                    mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                        mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z
                );
            }

            float getWarpedSilk(vec2 uv, float size, float density, float speed, float amp, float seed) {
                float rotX = (uv.x - uv.y) * 0.7071;
                float rotY = (uv.x + uv.y) * 0.7071;

                vec3 spaceCoord = vec3(rotX * size, rotY * size * 0.5, u_time * speed + seed);
                float warp = noise3D(spaceCoord) * amp;
                float warpCoord = rotY * density + warp * density;

                float fiber = sin(warpCoord);
                float edge = 0.05 + abs(sin(warp * 3.0)) * 0.03;
                return smoothstep(0.94 - edge, 0.98, fiber);
            }

            void main() {
                vec2 uv = gl_FragCoord.xy / u_resolution.xy;
                vec2 aspectUv = uv;
                aspectUv.x *= u_resolution.x / u_resolution.y;

                vec3 baseColor = vec3(0.957, 0.949, 0.933); 
                vec3 finalColor = baseColor;

                vec3 shadowColor = vec3(0.921, 0.910, 0.886);
                vec3 lightColor = vec3(1.0, 1.0, 1.0);

                float layer5 = getWarpedSilk(aspectUv, 1.2, 70.0, 0.05, 0.6, 9.8);
                finalColor = mix(finalColor, shadowColor, layer5 * 0.16);

                float layer4 = getWarpedSilk(aspectUv, 2.5, 180.0, 0.08, 0.8, 7.6);
                finalColor = mix(finalColor, shadowColor, layer4 * 0.22);

                float layer3 = getWarpedSilk(aspectUv, 4.0, 400.0, 0.12, 1.2, 5.4);
                finalColor = mix(finalColor, shadowColor, layer3 * 0.26);

                float layer2 = getWarpedSilk(aspectUv, 6.0, 700.0, 0.18, 1.5, 3.2);
                finalColor = mix(finalColor, lightColor, layer2 * 0.24);

                float glitter = sin(u_time * 2.0 + aspectUv.x * 4.0) * 0.5 + 0.5;
                float layer1 = getWarpedSilk(aspectUv, 9.0, 1050.0, 0.25, 2.0, 1.0);
                finalColor = mix(finalColor, lightColor, layer1 * (0.08 + glitter * 0.28));

                if (u_mouse_active > 0.01) {
                    vec2 relPos = gl_FragCoord.xy - u_mouse;

                    float rotX = (relPos.x - relPos.y) * 0.7071;
                    float rotY = (relPos.x + relPos.y) * 0.7071;

                    float dist = sqrt(pow(rotX * 0.07, 2.0) + pow(rotY * 1.6, 2.0));

                    float glowRadius = 140.0;
                    if (dist < glowRadius) {
                        float glowFactor = (1.0 - dist / glowRadius) * u_mouse_active;

                        float silkMask = (layer1 + layer2 * 1.5 + layer3 + layer4 * 0.5);
                        vec3 silverGlow = vec3(1.0, 1.0, 1.0) * glowFactor * 0.75;

                        finalColor += silverGlow * silkMask;
                    }
                }

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        const geometry = new THREE.PlaneGeometry(2, 2);
        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms,
            depthWrite: false,
            depthTest: false
        });
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        let targetMouseActive = 0.0;

        window.addEventListener('mousemove', (e) => {
            uniforms.u_mouse.value.set(e.clientX * window.devicePixelRatio, (window.innerHeight - e.clientY) * window.devicePixelRatio);
            targetMouseActive = 1.0;
        });

        window.addEventListener('mouseleave', () => {
            targetMouseActive = 0.0;
        });

        function handleResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            uniforms.u_resolution.value.set(w, h);
        }

        window.addEventListener('resize', handleResize);

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            uniforms.u_time.value = clock.getElapsedTime();
            uniforms.u_mouse_active.value += (targetMouseActive - uniforms.u_mouse_active.value) * 0.08;
            renderer.render(scene, camera);
        }

        handleResize();
        animate();
    </script>
</body>
</html>

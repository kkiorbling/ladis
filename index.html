<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LADIS | Literary & Visual Archive</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        /* 基础重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            background-color: #F4F2EE; /* 纸白 */
            color: #222222;            /* 深墨灰 */
            width: 100vw;
            height: 100vh;
            overflow: hidden;          /* 锁死视口，禁止滚动 */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 6rem 2rem;        /* 物理上下留白，将内容逼入你画的红框 */
        }

        /* 材质层 1：Museum Paper 纸张微颗粒 */
        .paper-texture {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* 材质层 2：动态呼吸雾 */
        .fog-layer {
            position: fixed;
            inset: -50%;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(circle at 30% 40%, rgba(232, 230, 226, 0.5) 0%, transparent 60%),
                        radial-gradient(circle at 80% 70%, rgba(138, 143, 150, 0.15) 0%, transparent 50%);
            animation: subtleFog 60s ease-in-out infinite alternate;
        }

        @keyframes subtleFog {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(2%, -3%) scale(1.03); }
            100% { transform: translate(-1%, 2%) scale(0.98); }
        }

        /* 上方红框：LADIS 样式调整 */
        .header-zone {
            z-index: 10;
            text-align: center;
            width: 100%;
        }

        .header-zone h1 {
            font-size: 2.2rem;
            font-weight: 300;           /* 极细 */
            letter-spacing: 0.6em;      /* 字母间距大幅拉开 */
            padding-left: 0.6em;        /* 完美抵消右侧留白，实现绝对物理居中 */
            text-transform: uppercase;
            color: #222222;
        }

        /* 中间留空 */
        .main-void {
            flex-grow: 1;
        }

        /* 下方红框：导航栏样式调整 */
        .nav-zone {
            z-index: 10;
            width: 100%;
            max-width: 600px;           /* 限制最大宽度，防止大屏上散开 */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav-links {
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-between; /* 5个入口在红框内横向绝对等分 */
            align-items: center;
        }

        .nav-links a {
            font-size: 1rem;
            font-weight: 300;
            color: #222222;
            text-decoration: none;
            letter-spacing: 0.05em;
            padding: 0.5rem 0;
            position: relative;
            transition: color 0.4s ease;
        }

        /* About 按钮颜色稍淡 */
        .nav-links a.about-link {
            color: #8A8F96;
        }

        /* 极轻的书签式 Hover 线条动效 */
        .nav-links a::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%) scale-x(0);
            width: 20px;
            height: 1px;
            background-color: #8A8F96;
            transition: transform 0.4s ease;
        }

        .nav-links a:hover::after {
            transform: translateX(-50%) scale-x(1);
        }

        .nav-links a:hover {
            color: #8A8F96;
        }
        .nav-links a.about-link:hover {
            color: #222222;
        }

        /* 导航下方的极细分割线 */
        .divider {
            width: 100%;
            height: 1px;
            background-color: #8A8F96;
            opacity: 0.15;
            margin-top: 0.8rem;
        }

        /* 优雅的首次加载淡入 */
        .fade-in-element {
            opacity: 0;
            animation: fadeIn 2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.6s; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(2px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 手机端自适应 */
        @media (max-width: 640px) {
            .header-zone h1 { font-size: 1.8rem; }
            .nav-links a { font-size: 0.9rem; }
            body { padding: 4rem 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="paper-texture"></div>
    <div class="fog-layer"></div>

    <div class="header-zone fade-in-element delay-1">
        <h1>LADIS</h1>
    </div>

    <div class="main-void"></div>

    <div class="nav-zone fade-in-element delay-2">
        <nav class="nav-links">
            <a href="novel.html">Novel</a>
            <a href="poetry.html">Poetry</a>
            <a href="illustration.html">Illustration</a>
            <a href="notes.html">Notes</a>
            <a href="#about" class="about-link">About</a>
        </nav>
        <div class="divider"></div>
    </div>

</body>
</html>

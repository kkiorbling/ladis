<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note. 02 - LADIS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Serif+SC:wght@200;300&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #F4F2EE;
            color: #222222;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8vh 2rem;
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
            position: relative;
        }
        /* 保持一致的纸张肌理 */
        .paper-texture {
            position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            mix-blend-mode: multiply;
        }
        .container {
            z-index: 10;
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
        }
        /* 返回归档页的优雅按钮 */
        .back-btn {
            font-size: 0.9rem;
            text-decoration: none;
            color: #8A8F96;
            letter-spacing: 0.1em;
            margin-bottom: 6vh;
            align-self: flex-start;
            transition: color 0.3s;
        }
        .back-btn:hover { color: #222222; }
        
        .note-header {
            margin-bottom: 5vh;
            border-bottom: 1px solid rgba(138, 143, 150, 0.15);
            padding-bottom: 2.5vh;
        }
        .note-index { font-size: 0.85rem; color: #8A8F96; margin-bottom: 0.5rem; letter-spacing: 0.05em; }
        .note-title { font-size: 1.6rem; font-weight: 300; letter-spacing: 0.05em; margin-bottom: 0.8rem; }
        .note-meta { font-size: 0.85rem; color: #8A8F96; }
        
        /* 舒适的阅读版式 */
        .note-content {
            font-size: 0.95rem;
            line-height: 1.9;
            color: #333333;
            text-align: justify;
            font-weight: 300;
        }
        .note-content p { margin-bottom: 1.8rem; text-indent: 2em; /* 首行缩进，更具书卷气 */ }
    </style>
</head>
<body>
    <div class="paper-texture"></div>
    <div class="container">
        <!-- 点击返回你的 notes 归档主页 -->
        <a href="notes.html" class="back-btn">← RETURN</a>
        
        <article>
            <header class="note-header">
                <div class="note-index">Note. 02</div>
                <h1 class="note-title"></h1>
                <div class="note-meta">2026.07.16</div>
            </header>
            
            <div class="note-content">
                <p>像玻璃上的水珠向上发射找天空，留下会动会闪的繁星</p>
                <p>很多东西我不喜欢或者不想面对，也都拿出来给人看吧</p>
            </div>
        </article>
    </div>
</body>
</html>

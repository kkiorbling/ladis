<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0">
    <title>LADIS | 馆藏看大图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #F4F2EE;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
        }
        .paper-texture {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }
        .view-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .view-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; 
            user-select: none;
        }
        .back-layer {
            position: fixed;
            inset: 0;
            z-index: 5;
            cursor: zoom-out;
        }
    </style>
</head>
<body>
    <div class="paper-texture"></div>
    <a href="./illustration.html" class="back-layer"></a>
    <div class="view-container">
        <a href="./illustration.html" style="display:contents;">
            <img src="pic10-hd.webp" alt="coco">
        </a>
    </div>
</body>
</html>

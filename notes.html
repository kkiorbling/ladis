<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LADIS | Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Serif+SC:wght@200;300&display=swap" rel="stylesheet">
    <style>
        * { margin: 0 !important; padding: 0 !important; box-sizing: border-box !important; }
        
        body {
            background: #F4F2EE !important;
            color: #222222 !important;
            min-height: 100vh !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            padding: 10vh 2rem !important;
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif !important;
            position: relative !important;
            /* 允许页面长滚动 */
            overflow-y: auto !important;
            overflow-x: hidden !important;
        }

        /* 统一的高级纸张肌理 */
        .paper-texture {
            position: fixed !important;
            inset: 0 !important;
            z-index: 1 !important;
            pointer-events: none !important;
            opacity: 0.025 !important;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E") !important;
            mix-blend-mode: multiply !important;
        }

        .container {
            z-index: 10 !important;
            width: 100% !important;
            max-width: 600px !important;
            display: flex !important;
            flex-direction: column !important;
        }

        /* 顶部导航区 */
        .archive-header {
            display: flex !important;
            justify-content: space-between !important;
            align-items: baseline !important;
            width: 100% !important;
            margin-bottom: 8vh !important;
            border-bottom: 1px solid rgba(138, 143, 150, 0.15) !important;
            padding-bottom: 2vh !important;
        }

        .back-btn {
            font-size: 0.9rem !important;
            text-decoration: none !important;
            color: #8A8F96 !important;
            letter-spacing: 0.1em !important;
            transition: color 0.3s !important;
        }
        .back-btn:hover { color: #222222 !important; }

        .archive-header h2 {
            font-size: 1.5rem !important;
            font-weight: 300 !important;
            letter-spacing: 0.2em !important;
            text-transform: uppercase !important;
        }

        /* 瀑布式 Notes 列表 */
        .notes-flow {
            width: 100% !important;
            display: flex !important;
            flex-direction: column !important;
            gap: 12vh !important; /* 每一条随笔之间留出呼吸感极强的空白 */
        }

        .note-card {
            width: 100% !important;
            display: flex !important;
            flex-direction: column !important;
        }

        /* 随笔的注释信息（顶部微调） */
        .note-meta-top {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            margin-bottom: 3.5vh !important;
            font-size: 0.85rem !important;
            color: #8A8F96 !important;
            letter-spacing: 0.05em !important;
        }

        .note-index {
            font-weight: 400 !important;
        }

        /* 随笔内容版式 */
        .note-content {
            font-size: 0.95rem !important;
            line-height: 1.9 !important;
            color: #333333 !important;
            text-align: justify !important;
            font-weight: 300 !important;
        }

        /* 首行不缩进，段落间留白，更现代干净 */
        .note-content p {
            margin-bottom: 1.5rem !important;
        }
        .note-content p:last-child {
            margin-bottom: 0 !important;
        }

        /* 随笔之间隐约的分割线 */
        .note-divider {
            width: 40px !important;
            height: 1px !important;
            background: #8A8F96 !important;
            opacity: 0.2 !important;
            margin: 10vh auto 0 auto !important; /* 让线处于两条随笔的正中间 */
        }
        .note-card:last-child .note-divider {
            display: none !important; /* 最后一篇随笔不需要底部分割线 */
        }
    </style>
</head>
<body>
    <div class="paper-texture"></div>

    <div class="container">
        <!-- 优雅的顶部导航，完美对齐 -->
        <header class="archive-header">
            <a href="index.html" class="back-btn">← Return</a>
            <h2>Notes</h2>
        </header>

        <!-- 所有的随笔在这里像长卷一样展开 -->
        <main class="notes-flow">

            <!-- 📝 随笔 02 (最新发表的在最上面) -->
            <article class="note-card">
                <div class="note-meta-top">
                    <span class="note-index">Note. 02</span>
                    <span class="note-date">2026.07.16</span>
                </div>
                <div class="note-content">
                    <p>像玻璃上的水珠向上发射找天空，留下动会闪的繁星</p>
                    <p>很多东西我不喜欢或者不想面对，也都拿出来给人看吧</p>
                </div>
                <div class="note-divider"></div>
            </article>

            <!-- 📝 随笔 01 -->
            <article class="note-card">
                <div class="note-meta-top">
                    <span class="note-index">Note. 01</span>
                    <span class="note-date">2026.06.20</span>
                </div>
                <div class="note-content">
                    <p>碎屑</p>
                </div>
                <div class="note-divider"></div>
            </article>

        </main>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LADIS | Novel Archive</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Serif+SC:wght@200;300&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #F4F2EE; /* 后续可一键调整为冷白 */
            color: #222222;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8vh 2rem;
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
        }

        /* 复用主页微颗粒 */
        .paper-texture {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* 顶部导航区 */
        .archive-header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8vh;
            z-index: 10;
        }

        .archive-header .back-btn {
            font-size: 0.9rem;
            text-decoration: none;
            color: #8A8F96;
            letter-spacing: 0.1em;
            transition: color 0.3s ease;
        }
        .archive-header .back-btn:hover {
            color: #222222;
        }

        .archive-header h2 {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        /* 卷宗目录列表 */
        .archive-list {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            z-index: 10;
        }

        .archive-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            text-decoration: none;
            color: #222222;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid rgba(138, 143, 150, 0.1);
            transition: border-color 0.4s ease;
        }

        .archive-item:hover {
            border-bottom-color: rgba(34, 34, 34, 0.4);
        }

        .item-title {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .item-index {
            font-size: 0.8rem;
            color: #8A8F96;
            letter-spacing: 0.05em;
        }

        .item-name {
            font-size: 1.05rem;
            font-weight: 300;
            letter-spacing: 0.05em;
        }

        .item-meta {
            font-size: 0.85rem;
            color: #8A8F96;
            letter-spacing: 0.05em;
            text-align: right;
        }

        @media (max-width: 640px) {
            body { padding: 6vh 1.5rem; }
            .archive-header { margin-bottom: 5vh; }
        }
        
                /* ==========================================
           回到顶部按键 (Back to Top)
           ========================================== */
        .back-to-top {
            position: fixed !important;
            bottom: 2.5rem !important;
            right: 2.5rem !important;
            z-index: 99 !important;
            background: transparent !important;
            border: none !important;
            outline: none !important;
            cursor: pointer !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            gap: 0.2rem !important;
            
            /* 默认隐藏与平滑过渡 */
            opacity: 0 !important;
            visibility: hidden !important;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1) !important;
            
            color: #8A8F96 !important;
            font-family: 'Cormorant Garamond', serif !important;
        }

        .back-to-top.visible {
            opacity: 0.5 !important;
            visibility: visible !important;
        }

        .back-to-top:hover {
            opacity: 1 !important;
            transform: translateY(-3px) !important;
            color: #222222 !important;
        }

        .back-to-top .arrow {
            font-size: 1.1rem !important;
            font-weight: 300 !important;
            line-height: 1 !important;
        }

        .back-to-top .text {
            font-size: 0.65rem !important;
            letter-spacing: 0.25em !important;
            font-weight: 300 !important;
            text-transform: uppercase !important;
        }

        @media (max-width: 640px) {
            .back-to-top {
                bottom: 1.8rem !important;
                right: 1.2rem !important;
            }
        }
    </style>
</head>
<body>

    <div class="paper-texture"></div>

    <header class="archive-header">
        <a href="https://www.ladis.site" class="back-btn">← Return</a >
        <h2>Novel</h2>
    </header>

    <main class="archive-list">

        <a href="novel-01.html" class="archive-item">
            <div class="item-title">
                <span class="item-index">Vol. 01</span>
                <span class="item-name">聆纯书</span>
            </div>
            <div class="item-meta">
                <span>Archive / 2026</span>
            </div>
        </a >

        <a href="novel-02.html" class="archive-item">
            <div class="item-title">
                <span class="item-index">Vol. 02</span>
                <span class="item-name">爱莲登那初稿</span>
            </div>
            <div class="item-meta">
                <span>Archive / 2026</span>
            </div>
        </a >

    </main>

        <!-- 悬浮回到顶部按钮 -->
    <button id="backToTop" class="back-to-top" title="回到顶部" aria-label="Back to top">
        <span class="arrow">↑</span>
        <span class="text">TOP</span>
    </button>

    <!-- 回到顶部平滑控制脚本 -->
    <script>
        const backToTopBtn = document.getElementById('backToTop');

        if (backToTopBtn) {
            // 监听滚动事件，超过 300px 显示按钮
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    backToTopBtn.classList.add('visible');
                } else {
                    backToTopBtn.classList.remove('visible');
                }
            });

            // 点击后平滑滚动到顶部
            backToTopBtn.addEventListener('click', () => {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
        }
    </script>

</body>
</html>
